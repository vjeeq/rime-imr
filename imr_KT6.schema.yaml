# Rime schema settings
# encoding: utf-8

schema:
  schema_id: imr_KT6
  name: IME-键道6
  version: "alpha"
  dependencies:
    - imr_KT6_lookup
    - imr_pinyin_comment

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 0
    states: [ 简体, 繁體 ]
  - name: danzi_mode
    reset: 0
    states: [ "词组", "单字" ]
  - name: sbb_hint
    reset: 1
    states: [ "关₆₃₀", "开₆₃₀" ]
  - name: sbb_disable_full
    reset: 0
    states: [ "开₆₃₀全码", "关₆₃₀全码" ]
  - name: topup_hint  # lua: keytao_filter.lua
    reset: 1
    states: [ "关顶功提示", "开顶功提示" ]


punctuator:
  __include: default:/punctuator               # 从 default 导入 punctuator 的所有配置，为了引用 digit_separators 等属性
  full_shape:
    __include: default:/punctuator/full_shape  # 从 default 导入配置
  half_shape:
    __include: default:/punctuator/half_shape  # 从 default 导入配置


engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@*smart_2
    - lua_processor@*for_topup
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@lookup
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - table_translator@lookup
    - history_translator@repeat_history
  filters:
    - simplifier@simplification
    - uniquifier
    - reverse_lookup_filter@reverse_lookup
    - lua_filter@*keytao_filter


speller:
  auto_select: false
  auto_select_unique_candidate: false
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  initials: "abcdefghijklmnopqrstuvwxyz;"


translator:
  dictionary: imr_KT6
  enable_charset_filter: false
  enable_completion: true
  enable_encoder: true
  enable_sentence: false
  enable_user_dict: false
  encode_commit_history: true
  max_phrase_length: 6
repeat_history:
  input: ;
  size: 1
  initial_quality: 10000

simplification:
  opencc_config: s2t.json
  option_name: simplification

key_binder:
  import_preset: default

lookup:
  tag: lookup
  dictionary: imr_KT6_lookup
  enable_user_dict: false
  prefix: ";"
  tips: "  〔反查〕"
  comment_format:
    - erase/^.*$//

reverse_lookup:
  tags: [ lookup ]
  dictionary: imr_pinyin_comment
  comment_format:
    __include: config/comment_format:/万象

recognizer:
  import_preset: default
  patterns:
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"   # 解决路由
    lookup: "^;[a-z]+$"


topup:
  topup_this: bcdefghjklmnpqrstwxyz
  topup_with: avuio
  min_length: 4
  max_length: 6
  auto_clear: true
  min_length_danzi: 2
  topup_command: false
